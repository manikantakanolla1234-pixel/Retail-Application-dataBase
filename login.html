<!DOCTYPE html>
<html>


<head>

<title>Login</title>


<style>

body{

background:#f1f3f6;
font-family:Arial;

}


.box{

width:350px;

background:white;

margin:80px auto;

padding:30px;

border-radius:10px;

}


input{

width:100%;

padding:12px;

margin:10px;

}


button{

width:100%;

padding:12px;

background:#2874f0;

color:white;

border:none;

}


</style>


</head>


<body>


<div class="box">


<h2>
User Login
</h2>



<form action="/login" method="POST">


<input
type="email"
name="email"
placeholder="Email">


<input
type="password"
name="password"
placeholder="Password">


<button>

Login

</button>


</form>


</div>


</body>


</html>
