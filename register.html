<!DOCTYPE html>
<html>

<head>

<title>User Registration</title>

<style>

body{
    font-family:Arial;
    background:#f1f3f6;
}


.container{

    width:400px;
    background:white;
    margin:50px auto;
    padding:30px;
    border-radius:10px;

}


input{

    width:100%;
    padding:12px;
    margin:10px 0;

}


button{

    width:100%;
    padding:12px;
    background:#2874f0;
    color:white;
    border:none;
    cursor:pointer;

}


</style>

</head>


<body>


<div class="container">


<h2>Create Account</h2>


<form action="/register" method="POST">


<input 
type="text"
name="name"
placeholder="Full Name"
required>


<input
type="email"
name="email"
placeholder="Email"
required>


<input
type="password"
name="password"
placeholder="Password"
required>


<input
type="text"
name="phone"
placeholder="Phone">


<input
type="text"
name="address"
placeholder="Address">



<button type="submit">

Register

</button>



</form>


</div>


</body>

</html>
