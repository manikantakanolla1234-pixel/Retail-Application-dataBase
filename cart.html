<!DOCTYPE html>

<html>

<head>

<title>Your Cart</title>


<style>


body{

font-family:Arial;

background:#f1f3f6;

}



.container{

width:80%;

margin:auto;

}



.card{

background:white;

padding:20px;

margin:15px;

border-radius:10px;

}



button{

background:red;

color:white;

border:none;

padding:10px;

}



.total{

background:#2874f0;

color:white;

padding:20px;

font-size:25px;

}


</style>


</head>


<body>


<div class="container">


<h1>

🛒 My Cart

</h1>



{% for item in cart %}



<div class="card">


<h2>

{{item[1]}}

</h2>


<p>

Price : ₹{{item[2]}}

</p>


<p>

Quantity : {{item[3]}}

</p>


<p>

Subtotal : ₹{{item[2]*item[3]}}

</p>



<a href="/cart/remove/{{item[0]}}">

<button>

Remove

</button>

</a>



</div>



{% endfor %}




<div class="total">


Total Amount :

₹{{total}}


</div>




<a href="/checkout">

<button>

Checkout

</button>

</a>



</div>


</body>

</html>
